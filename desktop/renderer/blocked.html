<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Magasin indisponible</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc;
             display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
      .card { text-align: center; max-width: 32rem; padding: 2rem; }
      h1 { font-size: 1.5rem; margin-bottom: .5rem; }
      p { color: #94a3b8; line-height: 1.5; }
      .dot { color: #ef4444; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="dot">●</span> Magasin indisponible</h1>
      <p>
        La caisse ne peut pas joindre le nœud magasin. Vérifiez la connexion réseau (LAN)
        et le service du magasin. Aucune vente n'est possible tant que le nœud est injoignable
        (pas de mode dégradé). La caisse se reconnecte automatiquement dès que le nœud répond.
      </p>
    </div>
  </body>
</html>
